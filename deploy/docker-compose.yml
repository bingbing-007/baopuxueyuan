services:
  gateway:
    build:
      context: ../backend
      dockerfile: baopu-gateway/Dockerfile
    container_name: baopu-gateway
    restart: always
    environment:
      SERVER_PORT: 8000
      BAOPU_JWT_SECRET: ${BAOPU_JWT_SECRET}
      LEARNING_SERVICE_URL: http://learning-service:8080
      IAM_SERVICE_URL: http://iam-service:8081
      DINGTALK_SERVICE_URL: http://dingtalk-service:8082
    ports:
      - "8000:8000"

  iam-service:
    build:
      context: ../backend
      dockerfile: baopu-iam-service/Dockerfile
    container_name: baopu-iam-service
    restart: always
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      BAOPU_JWT_SECRET: ${BAOPU_JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  learning-service:
    build:
      context: ../backend
      dockerfile: baopu-learning-service/Dockerfile
    container_name: baopu-learning-service
    restart: always
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      BAOPU_JWT_SECRET: ${BAOPU_JWT_SECRET}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  dingtalk-service:
    build:
      context: ../backend
      dockerfile: baopu-dingtalk-service/Dockerfile
    container_name: baopu-dingtalk-service
    restart: always
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"

  web-portal:
    build:
      context: ../frontend/web-portal
      dockerfile: Dockerfile
    container_name: baopu-web-portal
    restart: always
    depends_on:
      - learning-service
    ports:
      - "${WEB_PORT:-8081}:80"

  mysql:
    image: mysql:8.0
    container_name: baopu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: baopu-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: baopu-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

