server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: baopu-dingtalk-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/baopu_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:baopu}
    password: ${SPRING_DATASOURCE_PASSWORD:baopu123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info

baopu:
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    corp-id: ${DINGTALK_CORP_ID:}
    agent-id: ${DINGTALK_AGENT_ID:0}
