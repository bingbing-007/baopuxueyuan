server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: baopu-learning-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/baopu_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:baopu}
    password: ${SPRING_DATASOURCE_PASSWORD:baopu123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

management:
  endpoints:
    web:
      exposure:
        include: health,info

baopu:
  cors:
    allowed-origins: ${BAOPU_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
